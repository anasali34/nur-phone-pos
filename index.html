<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nur Phone POS</title>
<style>
body{font-family:Arial;margin:0;background:#f3f4f6}
header{background:#111827;color:#fff;padding:12px;text-align:center}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px}
input,select,button{width:100%;padding:8px;margin:4px 0}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px}
.hidden{display:none}
</style>
</head>
<body>
<header><h2>Nur Phone POS</h2></header>

<div id="login" class="card">
<h3>Login</h3>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<div class="card">
<h3>Settings (Admin)</h3>
<input id="rate" type="number" value="1450">
<button onclick="saveRate()">Save USD Rate</button>
</div>

<div class="card">
<h3>Add Product</h3>
<input id="name" placeholder="Mobile Name">
<input id="buy" type="number" placeholder="Buy Price USD">
<input id="sell" type="number" placeholder="Sell Price USD">
<input id="qty" type="number" placeholder="Qty">
<button onclick="addProduct()">Add</button>
</div>

<div class="card">
<h3>Stock</h3>
<table><thead><tr><th>Name</th><th>Qty</th><th>Sell$</th></tr></thead>
<tbody id="stock"></tbody></table>
</div>

<div class="card">
<h3>Sale</h3>
<input id="saleName" placeholder="Product Name">
<input id="saleQty" type="number" placeholder="Qty">
<select id="currency"><option>USD</option><option>IQD</option></select>
<button onclick="sale()">Sell</button>
</div>

<div class="card">
<h3>Report</h3>
<p id="sales">Sales: 0</p>
<p id="profit">Profit: 0</p>
</div>

<div class="card">
<h3>Receipt</h3>
<div id="receipt"></div>
</div>
</div>

<script>
let role="";
let items=JSON.parse(localStorage.items||"[]");
let sales=+localStorage.sales||0;
let profit=+localStorage.profit||0;

function login(){
 if(u.value==="anas"&&p.value==="878080"){role="admin";start();}
 else if(u.value==="staff"&&p.value==="112233"){role="staff";start();}
 else alert("Wrong login");
}
function start(){
 login.classList.add("hidden");
 app.classList.remove("hidden");
 if(role!=="admin") document.querySelector(".card").style.display="none";
 render();
}
function save(){localStorage.items=JSON.stringify(items);localStorage.sales=sales;localStorage.profit=profit;}
function saveRate(){localStorage.rate=rate.value;}
function addProduct(){
 items.push({name:name.value,buy:+buy.value,sell:+sell.value,qty:+qty.value});
 save(); render();
}
function sale(){
 let p=items.find(x=>x.name===saleName.value);
 let q=+saleQty.value;
 if(!p||p.qty<q)return alert("Not enough stock");
 p.qty-=q;
 sales+=p.sell*q;
 profit+=(p.sell-p.buy)*q;
 let inv="INV-"+Date.now();
 let total=p.sell*q;
 let ratev=+(localStorage.rate||1450);
 let text=currency.value==="IQD"?(total*ratev).toLocaleString()+" IQD":total+" USD";
 receipt.innerHTML="<b>"+inv+"</b><br>"+p.name+" x "+q+"<br>Total: "+text+"<br><button onclick='window.print()'>Print</button>";
 save(); render();
}
function render(){
 stock.innerHTML="";
 items.forEach(i=>stock.innerHTML+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.sell}</td></tr>`);
 salesEl=document.getElementById("sales"); profitEl=document.getElementById("profit");
 salesEl.innerText="Sales: $"+sales;
 profitEl.innerText="Profit: $"+profit;
}
render();
</script>
</body></html>
